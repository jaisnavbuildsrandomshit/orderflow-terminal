[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orderflow"
version = "0.1.0"
description = "Real-time market microstructure terminal for Binance Spot public market data"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "textual>=1.0,<9",
    "websockets>=13.0,<18",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
orderflow = "orderflow.__main__:main"

[tool.setuptools]
packages = ["orderflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
